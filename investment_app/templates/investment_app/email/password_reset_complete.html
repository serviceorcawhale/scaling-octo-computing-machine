{% extends 'investment_app/base.html' %}
{% load static %}

{% block content %}
<div class="auth-container" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 2rem;">
    <div class="auth-card" style="background: white; padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); width: 100%; max-width: 400px; text-align: center;">
        <div class="auth-header" style="margin-bottom: 2rem;">
            <a href="{% url 'index' %}" class="auth-logo" style="font-size: 1.5rem; font-weight: bold; color: var(--primary-color); text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                <i class="fas fa-coins"></i> CryptoInvest
            </a>
            <div class="success-icon" style="font-size: 3rem; color: var(--success-color); margin: 1.5rem 0;">
                <i class="fas fa-check-circle"></i>
            </div>
            <h1 style="margin: 0 0 0.5rem 0; color: var(--text-primary);">Password Reset Complete</h1>
            <p style="color: var(--text-secondary); margin: 0;">
                Your password has been successfully reset
            </p>
        </div>

        <div class="success-content">
            <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">
                You can now sign in with your new password.
            </p>
        </div>

        <div class="auth-footer" style="padding-top: 1.5rem; border-top: 1px solid var(--border-color);">
            <a href="{% url 'login' %}" class="btn btn-primary" style="width: 100%;">
                Sign In Now
            </a>
        </div>
    </div>
</div>
{% endblock %}
